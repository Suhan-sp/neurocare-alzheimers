{% extends "base.html" %}

{% block title %}Admin Login - NeuroCare Portal{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="glass-panel" style="padding: 2.25rem; border-top: 4px solid var(--accent-amber);">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="logo-icon" style="margin: 0 auto 1rem auto; width: 52px; height: 52px; font-size: 1.5rem; background: rgba(245, 158, 11, 0.15); color: var(--accent-amber);">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 style="font-family: 'Outfit', sans-serif; font-size: 1.8rem;">Administrator Login</h2>
            <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.25rem;">System Administration & Management Portal</p>
        </div>

        {% if error %}
            <div style="background: rgba(244, 63, 94, 0.15); border: 1px solid var(--accent-rose); color: #fb7185; padding: 0.85rem; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1.25rem; text-align: center;">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
            </div>
        {% endif %}

        <form action="/admin/login" method="POST">
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label class="form-label" for="username">Admin Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="e.g. admin" required>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; background: linear-gradient(135deg, #f59e0b, #d97706);">
                <i class="fa-solid fa-lock"></i> Login to Admin Portal
            </button>
        </form>

        <div style="margin-top: 1.5rem; background: rgba(10, 15, 29, 0.4); padding: 0.85rem; border-radius: 8px; font-size: 0.82rem; color: var(--text-muted); border: 1px solid var(--border-color); text-align: center;">
            <strong style="color: var(--text-secondary);">Admin Credentials:</strong> Username: <code>admin</code> | Password: <code>admin@123</code>
        </div>
    </div>
</div>
{% endblock %}
