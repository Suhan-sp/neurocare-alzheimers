{% extends "base.html" %}

{% block title %}Admin Security Verification - Register New Doctor{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="glass-panel" style="padding: 2.25rem; border-top: 4px solid var(--accent-amber);">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="logo-icon" style="margin: 0 auto 1rem auto; width: 52px; height: 52px; font-size: 1.5rem; background: rgba(245, 158, 11, 0.15); color: var(--accent-amber);">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 style="font-family: 'Outfit', sans-serif; font-size: 1.8rem;">Admin Authorization</h2>
            <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.25rem;">Enter Admin Authorization Password to register a new doctor account.</p>
        </div>

        {% if error %}
            <div style="background: rgba(244, 63, 94, 0.15); border: 1px solid var(--accent-rose); color: #fb7185; padding: 0.85rem; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1.25rem; text-align: center;">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
            </div>
        {% endif %}

        <form action="/admin/authorize-doctor" method="POST">
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label" for="admin_password">Admin Authorization Password</label>
                <input type="password" id="admin_password" name="admin_password" class="form-input" placeholder="Enter Admin password (admin@123)" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; background: linear-gradient(135deg, #f59e0b, #d97706);">
                <i class="fa-solid fa-shield-check"></i> Authorize & Continue
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="/admin/dashboard" style="color: var(--text-secondary); font-size: 0.88rem; text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> Back to Admin Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
