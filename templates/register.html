{% extends "base.html" %}

{% block title %}Create Account - NeuroCare Portal{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 2.5rem auto;">
    <div class="glass-panel" style="padding: 2.25rem;">
        <div style="text-align: center; margin-bottom: 1.75rem;">
            <div class="logo-icon" style="margin: 0 auto 1rem auto; width: 50px; height: 50px; font-size: 1.5rem; background: var(--gradient-success);">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 style="font-family: 'Outfit', sans-serif; font-size: 1.8rem;">Create Account</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Register to save & track your patient reports</p>
        </div>

        {% if error %}
            <div style="background: rgba(244, 63, 94, 0.15); border: 1px solid var(--accent-rose); color: #fb7185; padding: 0.75rem; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1.25rem; text-align: center;">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
            </div>
        {% endif %}

        <form action="/register" method="POST">
            <div class="form-group" style="margin-bottom: 1.1rem;">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="e.g. dr_john" required>
            </div>

            <div class="form-group" style="margin-bottom: 1.1rem;">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="e.g. john@clinic.com" required>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="At least 6 characters" required>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; background: var(--gradient-success);">
                <i class="fa-solid fa-user-check"></i> Register Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-secondary);">
            Already have an account? <a href="/login" style="color: var(--accent-teal); font-weight: 600; text-decoration: none;">Sign In Here</a>
        </div>
    </div>
</div>
{% endblock %}
