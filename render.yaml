services:
  - type: web
    name: neurocare-ai
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install --no-cache-dir torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt"
    startCommand: "python app.py"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PORT
        value: 10000
